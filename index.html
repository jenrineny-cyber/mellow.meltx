<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mellow.meltx</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  color:#493b35;

  background:
    radial-gradient(circle at 5% 10%, #ffd9e6 0 14px, transparent 15px),
    radial-gradient(circle at 95% 18%, #e1d5ff 0 18px, transparent 19px),
    radial-gradient(circle at 7% 65%, #ffe8b8 0 16px, transparent 17px),
    radial-gradient(circle at 94% 70%, #d9efff 0 17px, transparent 18px),
    linear-gradient(135deg,#fff8f3,#fff0f5,#f7f1ff);

  min-height:100vh;
}


/* HEADER */

header{
  padding:30px 20px 26px;
  text-align:center;

  background:
    radial-gradient(circle at 15% 20%, #ffffffaa 0 5px, transparent 6px),
    radial-gradient(circle at 85% 70%, #ffffff99 0 7px, transparent 8px),
    #f5ddd0;

  border-radius:0 0 32px 32px;
}

h1{
  margin:0;
  font-size:38px;
  letter-spacing:.5px;
}

header p{
  margin:8px 0 0;
  color:#806b61;
  font-size:15px;
}


/* WRAP */

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 16px 30px;
}


/* CARD */

.card{
  position:relative;
  overflow:hidden;

  background:#ffffffee;
  border-radius:28px;

  padding:24px;

  box-shadow:
    0 8px 25px #d6b8c733,
    0 2px 8px #00000008;
}


/* ของตกแต่งด้านใน */

.card::before{
  content:"🍓   ✦   🫐   ♡   🍌";
  position:absolute;

  top:9px;
  right:12px;

  font-size:19px;
  opacity:.55;

  pointer-events:none;
}

.card::after{
  content:"♡   🍊   ✨   🍇   ♡";
  position:absolute;

  bottom:10px;
  left:12px;

  font-size:17px;
  opacity:.45;

  pointer-events:none;
}


/* หัวข้อ */

.card h2{
  position:relative;
  z-index:2;

  margin-top:5px;
  color:#634d45;
}


/* PRICE */

.price{
  display:inline-block;

  font-size:27px;
  font-weight:bold;

  margin:8px 0 18px;

  background:#fff0f5;
  padding:7px 14px;

  border-radius:15px;

  color:#9a6679;
}


/* LABEL */

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  color:#5c4941;
}


/* INPUT */

input,
select,
textarea{
  width:100%;

  padding:13px;

  border:1px solid #ead9d0;
  border-radius:14px;

  font-size:16px;
  font-family:inherit;

  background:#fffdfc;

  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e4b7c8;
  box-shadow:0 0 0 3px #ffeaf1;
}


/* TOPPINGS */

.toppings{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.topping{
  background:#fffaf8;

  border:1px solid #ead9d0;
  border-radius:17px;

  padding:14px 8px;

  text-align:center;

  box-shadow:0 3px 8px #00000006;
}

.topping-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}


/* QUANTITY */

.quantity{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;
}

.quantity button{
  width:34px;
  height:34px;

  padding:0;

  border:0;
  border-radius:50%;

  background:#f7dce6;
  color:#684d57;

  font-size:22px;
  font-weight:bold;

  cursor:pointer;

  transition:.15s;
}

.quantity button:active{
  transform:scale(.9);
}

.quantity span{
  min-width:25px;

  text-align:center;

  font-size:18px;
  font-weight:bold;
}


/* TOTAL */

.total{
  font-size:22px;
  font-weight:bold;

  text-align:right;

  margin:22px 0;

  padding:13px 15px;

  background:#fff5d9;

  border-radius:16px;

  color:#604b3e;
}


/* SUBMIT */

.submit{
  width:100%;

  border:0;
  border-radius:16px;

  margin-top:20px;

  padding:16px;

  font-size:18px;
  font-weight:bold;

  background:#c58ca0;
  color:white;

  cursor:pointer;

  box-shadow:0 5px 12px #c58ca044;

  transition:.15s;
}

.submit:active{
  transform:scale(.98);
}


/* SUCCESS */

#success{
  display:none;

  background:#edf7e9;

  padding:16px;

  border-radius:15px;

  margin-top:15px;

  text-align:center;

  line-height:1.7;
}


/* โทรศัพท์ */

@media(max-width:500px){

  header{
    padding:23px 15px 22px;
    border-radius:0 0 26px 26px;
  }

  h1{
    font-size:32px;
  }

  header p{
    font-size:14px;
  }

  .wrap{
    padding:12px 10px 25px;
  }

  .card{
    padding:17px 15px;
    border-radius:23px;
  }

  .card::before{
    top:7px;
    right:8px;
    font-size:14px;
  }

  .card::after{
    bottom:7px;
    left:8px;
    font-size:13px;
  }

  .price{
    font-size:25px;
  }

  .toppings{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .topping{
    padding:12px 5px;
    border-radius:15px;
  }

  .topping-name{
    font-size:15px;
  }

  .quantity{
    gap:7px;
  }

  .quantity button{
    width:32px;
    height:32px;
  }

}

</style>
</head>


<body>

<header>

  <h1>mellow.meltx</h1>

  <p>
    Greek Yogurt • creamy • fresh • happy
  </p>

</header>


<div class="wrap">

<div class="card">

<h2>🥣 Greek Yogurt</h2>

<div class="price">
29฿ / scoop
</div>


<form id="orderForm">


<!-- จำนวนสกูป -->

<label>
จำนวนสกูป
</label>

<select id="scoops">

<option value="1">
1 สกูป
</option>

<option value="2">
2 สกูป
</option>

<option value="3">
3 สกูป
</option>

<option value="4">
4 สกูป
</option>

<option value="5">
5 สกูป
</option>

</select>


<!-- ท็อปปิ้ง -->

<label>
เลือกท็อปปิ้ง (อย่างละ 10฿)
</label>


<div class="toppings">


<!-- องุ่น -->

<div class="topping">

<div class="topping-name">
🍇 องุ่น
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('องุ่น',-1)"
>
−
</button>

<span id="qty-องุ่น">
0
</span>

<button
type="button"
onclick="changeQty('องุ่น',1)"
>
+
</button>

</div>

</div>


<!-- กล้วย -->

<div class="topping">

<div class="topping-name">
🍌 กล้วย
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('กล้วย',-1)"
>
−
</button>

<span id="qty-กล้วย">
0
</span>

<button
type="button"
onclick="changeQty('กล้วย',1)"
>
+
</button>

</div>

</div>


<!-- ส้ม -->

<div class="topping">

<div class="topping-name">
🍊 ส้ม
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('ส้ม',-1)"
>
−
</button>

<span id="qty-ส้ม">
0
</span>

<button
type="button"
onclick="changeQty('ส้ม',1)"
>
+
</button>

</div>

</div>


<!-- คอนเฟลก -->

<div class="topping">

<div class="topping-name">
🥣 คอนเฟลก
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('คอนเฟลก',-1)"
>
−
</button>

<span id="qty-คอนเฟลก">
0
</span>

<button
type="button"
onclick="changeQty('คอนเฟลก',1)"
>
+
</button>

</div>

</div>


<!-- โอริโอ้ -->

<div class="topping">

<div class="topping-name">
🍪 โอริโอ้
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('โอริโอ้',-1)"
>
−
</button>

<span id="qty-โอริโอ้">
0
</span>

<button
type="button"
onclick="changeQty('โอริโอ้',1)"
>
+
</button>

</div>

</div>


<!-- บลูเบอร์รี่ -->

<div class="topping">

<div class="topping-name">
🫐 บลูเบอร์รี่
</div>

<div class="quantity">

<button
type="button"
onclick="changeQty('บลูเบอร์รี่',-1)"
>
−
</button>

<span id="qty-บลูเบอร์รี่">
0
</span>

<button
type="button"
onclick="changeQty('บลูเบอร์รี่',1)"
>
+
</button>

</div>

</div>


</div>


<!-- ราคารวม -->

<div class="total">

รวม:
<span id="total">
29
</span>
฿

</div>


<!-- ชื่อลูกค้า -->

<label>
ชื่อลูกค้า
</label>

<input
id="name"
required
placeholder="ชื่อเล่น"
>


<!-- ช่องทางติดต่อ -->

<label>
ช่องทางติดต่อ
</label>

<input
id="contact"
required
placeholder="เช่น IG / Line / เบอร์โทร"
>


<!-- จุดนัดรับ -->

<label>
จุดนัดรับ
</label>

<select id="note" required>

<option value="">
เลือกจุดนัดรับ
</option>

<option value="ห้อง 3/12">
🏫 ห้อง 3/12
</option>

<option value="ใต้อาคาร 5">
🏢 ใต้อาคาร 5
</option>

</select>


<!-- ปุ่มสั่ง -->

<button
class="submit"
type="submit"
>
🛒 ยืนยันออเดอร์
</button>


<div id="success"></div>


</form>

</div>

</div>


<script>


/* =========================
   URL GOOGLE SHEETS
========================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxqcyNYNO16Bjz7-2FI68cYLJBo9vxLZK3FMj_M09eEfdDomHIYkzHb-yqPkmeqpiZN/exec";


/* =========================
   จำนวนท็อปปิ้ง
========================= */

let toppingQty = {

  "องุ่น": 0,

  "กล้วย": 0,

  "ส้ม": 0,

  "คอนเฟลก": 0,

  "โอริโอ้": 0,

  "บลูเบอร์รี่": 0

};


/* =========================
   จำนวนสกูป
========================= */

const scoops =
document.getElementById("scoops");


/* =========================
   เพิ่ม / ลดท็อปปิ้ง
========================= */

function changeQty(name, amount){

  toppingQty[name] =
    toppingQty[name] + amount;


  /* ห้ามติดลบ */

  if(toppingQty[name] < 0){

    toppingQty[name] = 0;

  }


  /* แสดงจำนวน */

  document.getElementById(
    "qty-" + name
  ).textContent =
    toppingQty[name];


  updatePrice();

}


/* =========================
   คำนวณราคา
========================= */

function updatePrice(){

  /* ราคาสกูป */

  let scoopPrice =
    Number(scoops.value) * 29;


  /* นับจำนวนท็อปปิ้ง */

  let toppingCount = 0;


  Object.values(toppingQty)
    .forEach(function(qty){

      toppingCount += qty;

    });


  /* ท็อปปิ้งชิ้นละ 10 */

  let toppingPrice =
    toppingCount * 10;


  /* รวม */

  let finalPrice =
    scoopPrice + toppingPrice;


  document.getElementById(
    "total"
  ).textContent =
    finalPrice;

}


/* =========================
   เปลี่ยนจำนวนสกูป
========================= */

scoops.addEventListener(
  "change",
  updatePrice
);


/* =========================
   สร้างข้อความท็อปปิ้ง
========================= */

function getToppings(){

  let result = [];


  Object.keys(toppingQty)
    .forEach(function(name){

      let qty =
        toppingQty[name];


      if(qty > 0){

        result.push(
          name + " " + qty
        );

      }

    });


  if(result.length === 0){

    return "ไม่เลือก";

  }


  return result.join(", ");

}


/* =========================
   ส่งออเดอร์
========================= */

document
.getElementById("orderForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const success =
      document.getElementById(
        "success"
      );


    success.style.display =
      "block";


    success.innerHTML =
      "กำลังส่งออเดอร์... ⏳";


    const order = {

      name:
        document.getElementById(
          "name"
        ).value,

      scoops:
        Number(scoops.value),

      toppings:
        getToppings(),

      total:
        Number(
          document.getElementById(
            "total"
          ).textContent
        ),

      contact:
        document.getElementById(
          "contact"
        ).value,

      note:
        document.getElementById(
          "note"
        ).value

    };


    try{

      await fetch(
        WEB_APP_URL,
        {

          method:"POST",

          mode:"no-cors",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(order)

        }
      );


      success.innerHTML =
        "<b>รับออเดอร์แล้ว! 🎉</b><br>" +
        "ยอดรวม <strong>" +
        order.total +
        "฿</strong><br>" +
        "ส่งออเดอร์เข้า Google Sheets แล้ว 💗";


      /* รีเซ็ตฟอร์ม */

      this.reset();


      /* รีเซ็ตจำนวนท็อปปิ้ง */

      Object.keys(toppingQty)
        .forEach(function(name){

          toppingQty[name] = 0;

          document.getElementById(
            "qty-" + name
          ).textContent = 0;

        });


      updatePrice();

  }

  catch(error){

    success.innerHTML =
      "<b>ส่งออเดอร์ไม่สำเร็จ 😭</b><br>" +
      "ลองใหม่อีกครั้ง";

  }

});


/* ราคาเริ่มต้น */

updatePrice();

</script>

</body>
</html>
