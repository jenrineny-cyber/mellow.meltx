<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mellow.meltx</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff8f3;
color:#493b35;
}

header{
padding:28px 20px;
text-align:center;
background:#f5ddd0;
}

h1{
margin:0;
font-size:38px;
}

header p{
margin:7px 0;
color:#806b61;
}

.wrap{
max-width:760px;
margin:auto;
padding:22px;
}

.card{
background:white;
border-radius:24px;
padding:22px;
box-shadow:0 5px 18px #0000000d;
}

.price{
font-size:28px;
font-weight:bold;
margin:8px 0 18px;
}

label{
display:block;
margin:13px 0 7px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid #ead9d0;
border-radius:12px;
font-size:16px;
background:#fffdfc;
}

.toppings{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.topping-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:12px;
border:1px solid #ead9d0;
border-radius:12px;
}

.topping-name{
font-weight:normal;
}

.qty{
display:flex;
align-items:center;
gap:7px;
}

.qty button{
width:34px;
height:34px;
padding:0;
border-radius:9px;
font-size:20px;
background:#b98572;
color:white;
border:0;
cursor:pointer;
}

.qty span{
min-width:22px;
text-align:center;
font-weight:bold;
}

.total{
font-size:22px;
font-weight:bold;
text-align:right;
margin:20px 0;
}

.order-btn{
width:100%;
border:0;
border-radius:14px;
padding:15px;
font-size:18px;
font-weight:bold;
background:#b98572;
color:white;
cursor:pointer;
}

#success{
display:none;
background:#edf7e9;
padding:16px;
border-radius:14px;
margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>mellow.meltx</h1>
<p>Greek Yogurt • creamy • fresh • happy</p>
</header>

<div class="wrap">
<div class="card">

<h2>🥣 Greek Yogurt</h2>
<div class="price">29฿ / scoop</div>

<form id="orderForm">

<label>จำนวนสกูป</label>

<select id="scoops">
<option value="1">1 สกูป</option>
<option value="2">2 สกูป</option>
<option value="3">3 สกูป</option>
<option value="4">4 สกูป</option>
<option value="5">5 สกูป</option>
</select>


<label>เลือกท็อปปิ้ง (อย่างละ 10฿)</label>

<div class="toppings">

<div class="topping-row">
<span class="topping-name">🍇 องุ่น</span>
<div class="qty">
<button type="button" onclick="changeQty('องุ่น',-1)">−</button>
<span id="qty-องุ่น">0</span>
<button type="button" onclick="changeQty('องุ่น',1)">+</button>
</div>
</div>

<div class="topping-row">
<span class="topping-name">🍌 กล้วย</span>
<div class="qty">
<button type="button" onclick="changeQty('กล้วย',-1)">−</button>
<span id="qty-กล้วย">0</span>
<button type="button" onclick="changeQty('กล้วย',1)">+</button>
</div>
</div>

<div class="topping-row">
<span class="topping-name">🍊 ส้ม</span>
<div class="qty">
<button type="button" onclick="changeQty('ส้ม',-1)">−</button>
<span id="qty-ส้ม">0</span>
<button type="button" onclick="changeQty('ส้ม',1)">+</button>
</div>
</div>

<div class="topping-row">
<span class="topping-name">🥣 คอนเฟลก</span>
<div class="qty">
<button type="button" onclick="changeQty('คอนเฟลก',-1)">−</button>
<span id="qty-คอนเฟลก">0</span>
<button type="button" onclick="changeQty('คอนเฟลก',1)">+</button>
</div>
</div>

<div class="topping-row">
<span class="topping-name">🍪 โอริโอ้</span>
<div class="qty">
<button type="button" onclick="changeQty('โอริโอ้',-1)">−</button>
<span id="qty-โอริโอ้">0</span>
<button type="button" onclick="changeQty('โอริโอ้',1)">+</button>
</div>
</div>

</div>


<div class="total">
รวม: <span id="total">29</span>฿
</div>


<label>ชื่อลูกค้า</label>
<input id="name" required placeholder="ชื่อเล่น">


<label>ช่องทางติดต่อ</label>
<input id="contact" required placeholder="เช่น IG / Line / เบอร์โทร">


<label>หมายเหตุ</label>
<textarea id="note" rows="3" placeholder="เช่น นัดรับที่..."></textarea>


<button class="order-btn" type="submit">
🛒 ยืนยันออเดอร์
</button>

<div id="success"></div>

</form>
</div>
</div>


<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxqcyNYNO16Bjz7-2FI68cYLJBo9vxLZK3FMj_M09eEfdDomHIYkzHb-yqPkmeqpiZN/exec";


const toppingQty = {
"องุ่น":0,
"กล้วย":0,
"ส้ม":0,
"คอนเฟลก":0,
"โอริโอ้":0
};


const scoops = document.getElementById("scoops");
const total = document.getElementById("total");


function changeQty(name, amount){

toppingQty[name] =
Math.max(0, toppingQty[name] + amount);

document.getElementById("qty-" + name).textContent =
toppingQty[name];

updatePrice();

}


function updatePrice(){

let scoopPrice =
Number(scoops.value) * 29;

let toppingCount =
Object.values(toppingQty)
.reduce((sum,qty) => sum + qty, 0);

let toppingPrice =
toppingCount * 10;

total.textContent =
scoopPrice + toppingPrice;

}


scoops.addEventListener(
"change",
updatePrice
);


document.getElementById("orderForm")
.addEventListener("submit", async function(e){

e.preventDefault();


const selectedToppings =

Object.entries(toppingQty)

.filter(([name,qty]) => qty > 0)

.map(([name,qty]) => name + " " + qty)

.join(", ") || "ไม่เลือก";


const order = {

name:
document.getElementById("name").value,

scoops:
Number(scoops.value),

toppings:
selectedToppings,

total:
Number(total.textContent),

contact:
document.getElementById("contact").value,

note:
document.getElementById("note").value || "-"

};


const success =
document.getElementById("success");


success.style.display = "block";

success.innerHTML =
"กำลังส่งออเดอร์... ⏳";


try{

await fetch(
WEB_APP_URL,
{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":
"text/plain;charset=utf-8"
},
body:
JSON.stringify(order)
}
);


success.innerHTML =
"<b>รับออเดอร์แล้ว! 🎉</b><br>" +
"ยอดรวม <strong>" +
order.total +
"฿</strong><br>" +
"ส่งออเดอร์เข้า Google Sheets แล้ว 💗";


this.reset();


Object.keys(toppingQty).forEach(name => {

toppingQty[name] = 0;

document.getElementById(
"qty-" + name
).textContent = "0";

});


updatePrice();


}

catch(error){

success.innerHTML =
"<b>ส่งออเดอร์ไม่สำเร็จ 😭</b><br>" +
"ลองใหม่อีกครั้ง";

}

});

</script>

</body>
</html>
