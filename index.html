<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mellow.meltx</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:linear-gradient(135deg,#fff8f3,#f8eee8);
  color:#493b35;
}

header{
  text-align:center;
  padding:35px 20px 30px;
  background:linear-gradient(135deg,#f7ded2,#f2cfc0);
  border-radius:0 0 35px 35px;
}

header h1{
  margin:0;
  font-size:42px;
  color:#684b40;
}

header p{
  margin:8px 0 0;
  color:#8b6d61;
  font-size:16px;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px;
}

.card{
  background:white;
  border-radius:28px;
  padding:25px;
  box-shadow:0 8px 30px rgba(100,70,50,.12);
}

h2{
  margin-top:0;
  text-align:center;
}

.price{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#a86f5c;
  margin-bottom:25px;
}

label.title{
  display:block;
  margin:18px 0 9px;
  font-weight:bold;
  font-size:17px;
}

select,
input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ead9d0;
  border-radius:14px;
  font-size:16px;
  background:#fffdfb;
  outline:none;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#c99582;
}

/* TOPPINGS */

.toppings{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.topping-card{
  border:1px solid #ead9d0;
  border-radius:18px;
  padding:12px;
  background:#fffaf7;
  text-align:center;
  transition:.2s;
}

.topping-card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(100,70,50,.08);
}

.topping-img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:0 auto 7px;
}

.topping-name{
  font-weight:bold;
  margin-bottom:8px;
}

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.counter button{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
  background:#e8c1b1;
  color:#5e4035;
  font-size:20px;
}

.counter span{
  min-width:22px;
  text-align:center;
  font-weight:bold;
  font-size:17px;
}

/* TOTAL */

.total-box{
  margin-top:25px;
  padding:18px;
  background:#fff2eb;
  border-radius:18px;
  text-align:center;
}

.total-title{
  font-size:15px;
  color:#80665c;
}

.total{
  font-size:32px;
  font-weight:bold;
  color:#a86f5c;
  margin-top:4px;
}

/* SUBMIT */

.submit-btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:20px;
  font-size:19px;
  font-weight:bold;
  background:linear-gradient(135deg,#bd8975,#a86f5c);
  color:white;
  cursor:pointer;
  transition:.2s;
}

.submit-btn:hover{
  transform:translateY(-2px);
}

#success{
  display:none;
  margin-top:15px;
  padding:17px;
  border-radius:15px;
  background:#edf8e8;
  color:#52734a;
  text-align:center;
}

@media(max-width:550px){

  .toppings{
    grid-template-columns:1fr 1fr;
  }

  header h1{
    font-size:34px;
  }

  .card{
    padding:18px;
  }

}

</style>
</head>

<body>

<header>

<h1>mellow.meltx</h1>

<p>🥣 Greek Yogurt • creamy • fresh • happy</p>

</header>


<div class="wrap">

<div class="card">

<h2>🥣 Greek Yogurt</h2>

<div class="price">
29฿ / scoop
</div>


<form id="orderForm">


<label class="title">
จำนวนสกูป
</label>

<select id="scoops">

<option value="1">1 สกูป</option>
<option value="2">2 สกูป</option>
<option value="3">3 สกูป</option>
<option value="4">4 สกูป</option>
<option value="5">5 สกูป</option>

</select>


<label class="title">
เลือกท็อปปิ้ง 🥰
</label>

<p style="font-size:14px;color:#8b746b;">
ท็อปปิ้งอย่างละ 10฿ • กด + เพื่อเพิ่มได้มากกว่า 1
</p>


<div class="toppings">


<!-- องุ่น -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1537640538966-79f369143f8f?auto=format&fit=crop&w=200&q=80"
alt="องุ่น">

<div class="topping-name">
🍇 องุ่น
</div>

<div class="counter">

<button type="button" onclick="changeTopping('องุ่น',-1)">−</button>

<span id="count-องุ่น">0</span>

<button type="button" onclick="changeTopping('องุ่น',1)">+</button>

</div>

</div>


<!-- กล้วย -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=200&q=80"
alt="กล้วย">

<div class="topping-name">
🍌 กล้วย
</div>

<div class="counter">

<button type="button" onclick="changeTopping('กล้วย',-1)">−</button>

<span id="count-กล้วย">0</span>

<button type="button" onclick="changeTopping('กล้วย',1)">+</button>

</div>

</div>


<!-- ส้ม -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1547514701-42782101795e?auto=format&fit=crop&w=200&q=80"
alt="ส้ม">

<div class="topping-name">
🍊 ส้ม
</div>

<div class="counter">

<button type="button" onclick="changeTopping('ส้ม',-1)">−</button>

<span id="count-ส้ม">0</span>

<button type="button" onclick="changeTopping('ส้ม',1)">+</button>

</div>

</div>


<!-- คอนเฟลก -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1517093157656-b9eccef91cb1?auto=format&fit=crop&w=200&q=80"
alt="คอนเฟลก">

<div class="topping-name">
🥣 คอนเฟลก
</div>

<div class="counter">

<button type="button" onclick="changeTopping('คอนเฟลก',-1)">−</button>

<span id="count-คอนเฟลก">0</span>

<button type="button" onclick="changeTopping('คอนเฟลก',1)">+</button>

</div>

</div>


<!-- โอริโอ้ -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=200&q=80"
alt="โอริโอ้">

<div class="topping-name">
🍪 โอริโอ้
</div>

<div class="counter">

<button type="button" onclick="changeTopping('โอริโอ้',-1)">−</button>

<span id="count-โอริโอ้">0</span>

<button type="button" onclick="changeTopping('โอริโอ้',1)">+</button>

</div>

</div>


<!-- บลูเบอร์รี่ -->

<div class="topping-card">

<img
class="topping-img"
src="https://images.unsplash.com/photo-1498557850523-fd3d118b962e?auto=format&fit=crop&w=200&q=80"
alt="บลูเบอร์รี่">

<div class="topping-name">
🫐 บลูเบอร์รี่
</div>

<div class="counter">

<button type="button" onclick="changeTopping('บลูเบอร์รี่',-1)">−</button>

<span id="count-บลูเบอร์รี่">0</span>

<button type="button" onclick="changeTopping('บลูเบอร์รี่',1)">+</button>

</div>

</div>


</div>


<!-- TOTAL -->

<div class="total-box">

<div class="total-title">
ยอดรวมทั้งหมด
</div>

<div class="total">
<span id="total">29</span>฿
</div>

</div>


<label class="title">
ชื่อลูกค้า
</label>

<input
id="name"
required
placeholder="ชื่อเล่น">


<label class="title">
ช่องทางติดต่อ
</label>

<input
id="contact"
required
placeholder="เช่น IG / Line / เบอร์โทร">


<label class="title">
หมายเหตุ
</label>

<textarea
id="note"
rows="3"
placeholder="เช่น นัดรับที่..."></textarea>


<button
class="submit-btn"
type="submit">

🛒 ยืนยันออเดอร์

</button>


<div id="success"></div>


</form>

</div>

</div>


<script>


/* =========================
   URL GOOGLE APPS SCRIPT
========================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxqcyNYNO16Bjz7-2FI68cYLJBo9vxLZK3FMj_M09eEfdDomHIYkzHb-yqPkmeqpiZN/exec";


/* =========================
   ราคาท็อปปิ้ง
========================= */

const TOPPING_PRICE = 10;

const SCOOP_PRICE = 29;


/* =========================
   จำนวนท็อปปิ้ง
========================= */

const toppingCounts = {

  "องุ่น":0,
  "กล้วย":0,
  "ส้ม":0,
  "คอนเฟลก":0,
  "โอริโอ้":0,
  "บลูเบอร์รี่":0

};


/* =========================
   เพิ่ม / ลด ท็อปปิ้ง
========================= */

function changeTopping(name, amount){

  toppingCounts[name] += amount;

  if(toppingCounts[name] < 0){

    toppingCounts[name] = 0;

  }

  document.getElementById(
    "count-" + name
  ).textContent = toppingCounts[name];

  updatePrice();

}


/* =========================
   คำนวณราคา
========================= */

function updatePrice(){

  const scoops =
    Number(document.getElementById("scoops").value);

  let toppingTotal = 0;

  Object.values(toppingCounts).forEach(function(count){

    toppingTotal += count * TOPPING_PRICE;

  });

  const total =
    (scoops * SCOOP_PRICE) + toppingTotal;

  document.getElementById("total").textContent = total;

}


/* =========================
   เปลี่ยนจำนวนสกูป
========================= */

document
.getElementById("scoops")
.addEventListener("change", updatePrice);


/* =========================
   ส่งออเดอร์
========================= */

document
.getElementById("orderForm")
.addEventListener("submit", async function(e){

  e.preventDefault();


  const name =
    document.getElementById("name").value;

  const contact =
    document.getElementById("contact").value;

  const note =
    document.getElementById("note").value || "-";


  const scoops =
    Number(document.getElementById("scoops").value);


  /* สร้างรายการท็อปปิ้ง */

  const toppingList = [];

  Object.entries(toppingCounts).forEach(
    function([name,count]){

      if(count > 0){

        toppingList.push(
          name + " " + count
        );

      }

    }
  );


  const toppings =
    toppingList.length > 0
      ? toppingList.join(", ")
      : "ไม่เลือก";


  const order = {

    name:name,

    scoops:scoops,

    toppings:toppings,

    total:Number(
      document.getElementById("total").textContent
    ),

    contact:contact,

    note:note

  };


  const success =
    document.getElementById("success");


  success.style.display = "block";

  success.innerHTML =
    "กำลังส่งออเดอร์... ⏳";


  try{


    await fetch(
      WEB_APP_URL,
      {

        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:JSON.stringify(order)

      }
    );


    success.innerHTML =
      "<b>รับออเดอร์แล้ว! 🎉</b><br>" +
      "ยอดรวม <strong>" +
      order.total +
      "฿</strong><br>" +
      "ส่งออเดอร์เข้า Google Sheets แล้ว 💗";


    /* รีเซ็ตฟอร์ม */

    this.reset();


    /* รีเซ็ตจำนวนท็อปปิ้ง */

    Object.keys(toppingCounts).forEach(
      function(name){

        toppingCounts[name] = 0;

        document.getElementById(
          "count-" + name
        ).textContent = 0;

      }
    );


    updatePrice();


  }

  catch(error){

    success.innerHTML =
      "<b>ส่งออเดอร์ไม่สำเร็จ 😭</b><br>" +
      "ลองใหม่อีกครั้ง";

  }

});


</script>

</body>
</html>
